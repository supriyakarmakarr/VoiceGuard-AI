services:
  - type: web
    name: voiceguard-ai
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m uvicorn api.server:app --host 0.0.0.0 --port $PORT --workers 1"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: VOICEGUARD_API_KEY
        generateValue: true
      - key: API_DEMO_MODE
        value: "false"
# Configure an adequate memory tier for PyTorch before deployment.
# Build never retrains or overwrites the supplied checkpoints.
