services:
  - type: web
    name: voiceguard-ai
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt && python scripts/train_models.py"
    startCommand: "python -m uvicorn api.server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
